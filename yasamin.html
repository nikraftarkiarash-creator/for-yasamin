<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>برای یاسمین 💙</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: "Vazirmatn", "IRANSans", "Tahoma", sans-serif;
    background:
      radial-gradient(circle at 15% 20%, #cfe9ff 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #ffd9ec 0%, transparent 45%),
      radial-gradient(circle at 50% 95%, #e2d7ff 0%, transparent 50%),
      linear-gradient(160deg, #eaf4ff 0%, #fdeaf4 55%, #efe6ff 100%);
    display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  /* ---- پس‌زمینه گربه‌ها ---- */
  .bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .bg span {
    position: absolute; opacity: .35; animation: float 9s ease-in-out infinite;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,.06));
  }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(-6deg); }
    50%     { transform: translateY(-22px) rotate(6deg); }
  }
  /* ---- کارت اصلی ---- */
  .card {
    position: relative; z-index: 3; text-align: center;
    background: rgba(255,255,255,.66);
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255,255,255,.9);
    border-radius: 34px; padding: 34px 30px 30px;
    box-shadow: 0 22px 60px rgba(120,110,180,.22);
    max-width: 92vw;
    transition: opacity .6s ease, transform .6s ease;
  }
  .hi { font-size: 19px; color: #7a6f9b; margin: 0 0 18px; }
  /* ---- جعبه کادو ---- */
  .giftwrap { width: 190px; height: 180px; margin: 0 auto; position: relative; cursor: pointer;
              animation: wiggle 2.2s ease-in-out infinite; }
  @keyframes wiggle {
    0%,100% { transform: rotate(-2.5deg) scale(1); }
    50%     { transform: rotate(2.5deg) scale(1.04); }
  }
  .lid { position: absolute; top: 34px; left: 0; width: 190px; height: 40px;
         background: linear-gradient(180deg,#7fb6ff,#4f8ff0); border-radius: 10px;
         box-shadow: 0 6px 14px rgba(60,110,200,.35); transition: .8s cubic-bezier(.5,-0.6,.4,1.6); z-index: 2; }
  .box { position: absolute; top: 72px; left: 14px; width: 162px; height: 104px;
         background: linear-gradient(180deg,#a9d0ff,#6fa8f5); border-radius: 0 0 16px 16px;
         box-shadow: inset 0 -10px 20px rgba(0,0,0,.08), 0 12px 24px rgba(60,110,200,.28); }
  .ribbon-v { position: absolute; top: 72px; left: 82px; width: 26px; height: 104px;
              background: linear-gradient(180deg,#fff0f7,#ffc6e0); z-index: 1; }
  .lid-ribbon { position: absolute; top: 34px; left: 82px; width: 26px; height: 40px;
                background: linear-gradient(180deg,#fff0f7,#ffc6e0); z-index: 3; transition: inherit; }
  .bow { position: absolute; top: 2px; left: 50%; transform: translateX(-50%); font-size: 44px; z-index: 4;
         transition: .8s cubic-bezier(.5,-0.6,.4,1.6); }
  .opened .lid      { transform: translate(45px,-140px) rotate(-32deg); opacity: 0; }
  .opened .lid-ribbon{ transform: translate(45px,-140px) rotate(-32deg); opacity: 0; }
  .opened .bow      { transform: translate(-50%,-190px) rotate(40deg); opacity: 0; }
  .opened .giftwrap { animation: none; }
  /* ---- دکمه ---- */
  .btn { margin-top: 22px; border: 0; cursor: pointer; font-family: inherit; font-size: 18px; font-weight: 700;
         color: #fff; padding: 14px 34px; border-radius: 999px;
         background: linear-gradient(135deg,#5b9bf8,#a06ff0 55%,#ff8fc0);
         box-shadow: 0 10px 24px rgba(120,90,220,.35); transition: transform .2s, box-shadow .2s; }
  .btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 16px 30px rgba(120,90,220,.45); }
  .btn:active { transform: scale(.97); }
  /* ---- پیام نهایی ---- */
  .msg { position: fixed; inset: 0; z-index: 5; display: flex; flex-direction: column;
         align-items: center; justify-content: center; gap: 16px; text-align: center;
         opacity: 0; pointer-events: none; transition: opacity 1s ease .5s; padding: 20px; }
  .msg.show { opacity: 1; }
  .msg h1 {
    margin: 0; font-size: clamp(26px, 6vw, 54px); line-height: 1.7; font-weight: 800;
    background: linear-gradient(90deg,#3d7ff0,#8a5bf0,#ff6fa8,#3d7ff0);
    background-size: 300% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shine 5s linear infinite; text-shadow: 0 8px 30px rgba(255,255,255,.6);
  }
  @keyframes shine { to { background-position: 300% center; } }
  .msg .sub { font-size: clamp(14px,3.4vw,20px); color: #6b6390; }
  .heart { font-size: 40px; animation: beat 1.1s ease-in-out infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 30%{transform:scale(1.25)} }
  /* ---- گل‌ها ---- */
  .petal { position: fixed; top: -60px; z-index: 4; pointer-events: none; user-select: none; }
  @keyframes fall {
    0%   { transform: translateY(-10vh) rotate(0deg) scale(var(--s)); opacity: 0; }
    10%  { opacity: 1; }
    100% { transform: translateY(112vh) translateX(var(--drift)) rotate(720deg) scale(var(--s)); opacity: .9; }
  }
  .hide { opacity: 0 !important; transform: scale(.8); pointer-events: none; }
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<div class="card" id="card">
  <p class="hi">یه چیز کوچولو برای یه آدم خیلی خاص 🐾</p>
  <div class="giftwrap" id="gift">
    <div class="bow">🎀</div>
    <div class="lid"></div>
    <div class="lid-ribbon"></div>
    <div class="box"></div>
    <div class="ribbon-v"></div>
  </div>
  <button class="btn" id="btn">باز کردن کادو 🎁</button>
</div>

<div class="msg" id="msg">
  <div class="heart">💙</div>
  <h1>تقدیم به عشق زندگیم یاسمین 💙</h1>
  <div class="sub">هر روزت مثل خودت قشنگ باشه 🌸🐱</div>
</div>

<script>
  // پس‌زمینه گربه‌ها
  const cats = ['🐱','🐈','😻','🐾','🐈‍⬛','🧶','🐟','😽','🎀','☁️'];
  const bg = document.getElementById('bg');
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span');
    s.textContent = cats[Math.floor(Math.random()*cats.length)];
    s.style.left = Math.random()*98 + '%';
    s.style.top  = Math.random()*96 + '%';
    s.style.fontSize = (20 + Math.random()*40) + 'px';
    s.style.animationDelay = (Math.random()*9) + 's';
    s.style.animationDuration = (7 + Math.random()*6) + 's';
    bg.appendChild(s);
  }

  const flowers = ['🌸','🌺','🌹','🌷','💐','🌼','🏵️','💮','🌻','💙','💖','✨'];
  let raining = false;
  function dropFlower() {
    const f = document.createElement('div');
    f.className = 'petal';
    f.textContent = flowers[Math.floor(Math.random()*flowers.length)];
    f.style.left = Math.random()*100 + 'vw';
    f.style.fontSize = (18 + Math.random()*30) + 'px';
    f.style.setProperty('--s', (0.7 + Math.random()*0.8).toFixed(2));
    f.style.setProperty('--drift', (Math.random()*200 - 100) + 'px');
    f.style.animation = `fall ${5 + Math.random()*5}s linear forwards`;
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 11000);
  }
  function burst(n) { for (let i=0;i<n;i++) setTimeout(dropFlower, i*40); }

  function open() {
    if (raining) return; raining = true;
    document.getElementById('gift').parentElement.classList.add('opened');
    document.getElementById('gift').classList.add('opened');
    burst(60);
    setTimeout(() => {
      document.getElementById('card').classList.add('hide');
      document.getElementById('msg').classList.add('show');
    }, 700);
    setInterval(dropFlower, 180);
  }
  document.getElementById('btn').onclick = open;
  document.getElementById('gift').onclick = open;
</script>
</body>
</html>
